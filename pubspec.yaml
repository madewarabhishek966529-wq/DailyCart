name: dailycart
description: "DailyCart - Local-first grocery list and shopping manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  mockito: ^5.4.5
  sqflite_common_ffi: ^2.3.5+1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
